[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# sharp ships native bindings; let Netlify copy node_modules verbatim instead of
# bundling them into this function.
[functions.process-image]
  node_bundler = "none"

# ---------------------------------------------------------------------------
# Headers — MIRRORED IN provision/cloudformation/site.yaml. Do not edit either
# side alone.
#
# The static site is served by CloudFront, not Netlify, so these rules only
# reach the residual *.netlify.app origin (the /api/* functions). The live site
# gets the same headers from:
#   SecurityHeadersPolicy       -> X-Frame-Options, X-Content-Type-Options,
#                                  Referrer-Policy, Strict-Transport-Security,
#                                  Content-Security-Policy
#   PermissionsPolicyFunction   -> Permissions-Policy (viewer-response CloudFront
#                                  Function; the response-headers policy cannot
#                                  express it)
#   AdminSecurityHeadersPolicy  -> stricter CSP/referrer + X-Robots-Tag on admin
#   SiteCachePolicy + deploy.yml Cache-Control per object
# `provision/cloudformation/verify-live-headers.sh` asserts every one of them at
# the edge; it is the check that matters, not this file.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-/FJnHy2CGGOeIvkDC7eAFRc0uChU+dX1u6kGp3hLFeY=' 'sha256-bg3x1TEm9BoDXLXO5rAhMUXV/KJxxaq62WowoWP9e5I=' 'sha256-1L4hjMX+eDVyE+TFI8sDl4GsQT3bagbNBNguhlOg1bw=' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'sha256-caYMD6dyE/5B5P/vNbWFURYhm+9XrU5Ece7ivqHL3IU=' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com https://*.s3.ap-south-1.amazonaws.com https://*.execute-api.ap-south-1.amazonaws.com; frame-src 'self' https://www.google.com https://maps.google.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; upgrade-insecure-requests;"

# Product photos never change once uploaded — let browsers keep them for a year
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# S3-hosted product photos (served through CloudFront on the live site; this
# header only applies if Netlify ever serves them directly)
[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# products.json is the live content feed — always revalidate
[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "no-store"

# Keep the admin panel out of search engines and stricter than public pages
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.s3.ap-south-1.amazonaws.com https://*.execute-api.ap-south-1.amazonaws.com; frame-src 'none'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; upgrade-insecure-requests;"
