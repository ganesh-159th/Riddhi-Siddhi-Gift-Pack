<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05081a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found — Riddhi Siddhi Gift &amp; Pack</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #05081a;
      color: #e8eaf6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .font-display { font-family: "Playfair Display", Georgia, "Times New Roman", serif; }

    /* Shimmer gold gradient text */
    .text-gold-gradient {
      background: linear-gradient(115deg, #f7df8f 0%, #d4af37 35%, #f0c14b 55%, #9a7a1e 78%, #eec44f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Floating background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    .orb-gold { background: #d4af37; width: 500px; height: 500px; top: -120px; right: -140px; }
    .orb-wine { background: #8a1c3c; width: 400px; height: 400px; bottom: -80px; left: -100px; }

    /* Main content */
    .wrapper {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      gap: 2rem;
    }

    /* 404 number */
    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, rgba(212,175,55,0.15) 0%, rgba(212,175,55,0.05) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px rgba(212,175,55,0.2);
      user-select: none;
    }

    .error-title {
      font-size: clamp(1.5rem, 0.8rem + 3vw, 2.5rem);
      font-weight: 700;
      line-height: 1.2;
    }

    .error-desc {
      max-width: 28rem;
      font-size: clamp(0.95rem, 0.85rem + 0.5vw, 1.1rem);
      line-height: 1.6;
      color: #94a3b8;
    }

    /* Quick links grid */
    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
      gap: 0.75rem;
      width: 100%;
      max-width: 32rem;
    }
    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #e8eaf6;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .links a:hover {
      background: rgba(212,175,55,0.1);
      border-color: rgba(212,175,55,0.3);
      color: #d4af37;
      transform: translateY(-2px);
    }

    /* CTA buttons */
    .cta-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.75rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: #25D366;
      color: #05081a;
    }
    .btn-primary:hover { filter: brightness(1.12); transform: translateY(-2px); }
    .btn-secondary {
      background: transparent;
      color: #d4af37;
      border: 1.5px solid rgba(212,175,55,0.35);
    }
    .btn-secondary:hover {
      background: rgba(212,175,55,0.1);
      border-color: #d4af37;
    }

    /* WhatsApp icon */
    .wa-icon {
      width: 1.2em;
      height: 1.2em;
      vertical-align: -0.15em;
      fill: currentColor;
    }

    /* Divider */
    .divider {
      width: 4rem;
      height: 2px;
      border-radius: 1px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: #475569;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .footer a { color: #d4af37; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* Pulse glow animation */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37,211,102,0.45); }
      55% { box-shadow: 0 0 0 14px rgba(37,211,102,0); }
    }
    .pulse-glow { animation: pulseGlow 2.2s ease-out infinite; }
  </style>
</head>
