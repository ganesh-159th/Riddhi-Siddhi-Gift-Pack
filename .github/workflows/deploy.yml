name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Production deploys must NOT be cancelled mid-flight (a cancelled deploy could
# leave the live site in a half-updated state). New pushes queue behind the
# running deploy instead.
concurrency:
  group: deploy-production-${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify generated SEO artifacts
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q 'Disallow: /admin.html' dist/robots.txt
          grep -q '^Sitemap: ' dist/robots.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to production (S3 + CloudFront)
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Backup current live site
        run: |
          set -euo pipefail
          # Stage the current live site locally first. Syncing S3->S3 across the
          # same bucket (rollbacks/* <-> root) is fragile: the --exclude patterns
          # also match the source and --delete can clobber the whole bucket.
          #
          # products/* is excluded for two reasons. It is admin-owned data that a
          # code deploy never modifies (the deploy sync below skips it too), and
          # the restore path must not roll back an admin's photo changes.
          # Skipping it also matters for cost: rollbacks/<sha>/ is a brand-new
          # empty prefix on every run, so `sync` re-PUTs every object in staging
          # regardless of whether it changed. With ~175 product photos that was
          # ~175 avoidable PUT operations per deploy, which is what pushed spend
          # past the S3 free tier.
          rm -rf backup-staging && mkdir -p backup-staging
          aws s3 sync "s3://$S3_BUCKET/" backup-staging/ \
            --exclude "rollbacks/*" --exclude "pr-*" --exclude "products/*" --delete --region "$AWS_REGION"
          # Sanity check: never deploy over a broken/empty backup.
          # NOTE: no `find ... | grep -q .` here — under `set -o pipefail` grep -q
          # exiting on its first match SIGPIPEs find, falsely reporting an empty
          # backup. `-print -quit` prints one path then stops on its own.
          if [[ -z "$(find backup-staging -mindepth 1 -print -quit)" ]]; then
            echo "ERROR: backup is empty; aborting to protect the live site." >&2
            exit 1
          fi
          aws s3 sync backup-staging/ "s3://$S3_BUCKET/rollbacks/${{ github.sha }}/" \
            --region "$AWS_REGION"

      - name: Deploy static files to S3
        run: |
          set -euo pipefail
          aws s3 sync dist/images "s3://$S3_BUCKET/images" \
            --delete --region "$AWS_REGION" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --delete --region "$AWS_REGION" \
            --exclude "images/*" --exclude "products/*" --exclude "index.html" --exclude "admin.html" \
            --exclude "404.html" --exclude "products.json" \
            --exclude "rollbacks/*" --exclude "pr-*" \
            --cache-control "public, max-age=3600"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --region "$AWS_REGION" --cache-control "no-store"
          aws s3 cp dist/admin.html "s3://$S3_BUCKET/admin.html" \
            --region "$AWS_REGION" --cache-control "no-store"
          aws s3 cp dist/404.html "s3://$S3_BUCKET/404.html" \
            --region "$AWS_REGION" --cache-control "no-store"
          aws s3 cp dist/products.json "s3://$S3_BUCKET/products.json" \
            --region "$AWS_REGION" --cache-control "no-store"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --region "$AWS_REGION"

      - name: Smoke test live site
        run: |
          set -euo pipefail
          # CloudFront edge propagation is not instant after an invalidation, so
          # poll until the expected status is observed instead of failing the
          # moment a stray edge still returns the stale pre-deploy value.
          wait_for_status() {
            local url="$1" want="$2" attempts=30 i code
            for i in $(seq 1 "$attempts"); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || true)
              if [ "$code" = "$want" ]; then
                echo "OK: $url -> HTTP $code"; return 0
              fi
              echo "  waiting for $want on $url (got $code) [$i/$attempts]"
              sleep 5
            done
            echo "ERROR: $url never returned HTTP $want (last: $code)" >&2
            return 1
          }

          # Core pages must serve 200.
          wait_for_status "$SITE_URL/" 200
          wait_for_status "$SITE_URL/products.json" 200
          wait_for_status "$SITE_URL/index.html" 200
          wait_for_status "$SITE_URL/sitemap.xml" 200
          wait_for_status "$SITE_URL/robots.txt" 200

          # Unknown paths must return 404 AND render the branded page.
          attempts=20
          for i in $(seq 1 "$attempts"); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SITE_URL/this-page-does-not-exist" || true)
            body=$(curl -s -L --max-time 15 "$SITE_URL/this-page-does-not-exist" 2>/dev/null || true)
            if [ "$code" = "404" ] && printf '%s' "$body" | grep -q "Page Not Found"; then
              echo "OK: unknown path -> HTTP 404 + branded page"; break
            fi
            echo "  waiting for branded 404 (code=$code) [$i/$attempts]"
            [ "$i" = "$attempts" ] && { echo "ERROR: branded 404 never served" >&2; exit 1; }
            sleep 5
          done

          # Guard: the brand page must NOT be served for a real page.
          wait_for_status "$SITE_URL/admin.html" 200

      - name: Write deployment summary
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "- **Site**: $SITE_URL"
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **CloudFront distribution**: $CLOUDFRONT_DISTRIBUTION_ID"
            echo "- **Rollback backup**: s3://$S3_BUCKET/rollbacks/${{ github.sha }}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old rollbacks (delete backups older than 1 week)
        # A rollback folder is only useful within the rollback window: once the
        # site has been live for 7 days, an older snapshot is unused and just
        # burns S3 storage. Delete every rollback folder whose newest object is
        # older than MAX_AGE_DAYS (computed by the folder's LastModified, i.e.
        # ~when that deploy snapshot was taken). Runs on success AND failure so
        # cleanup never depends on a deploy succeeding; the S3 lifecycle rule
        # "DeleteOldRollbacks" (expire rollbacks/* after 7 days) remains the
        # always-on, bucket-level guarantee. `success() || failure()` (rather
        # than a bare `! cancelled()`) so a non-cancelled run always prunes.
        if: ${{ success() || failure() }}
        env:
          MAX_AGE_DAYS: "7"
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "$MAX_AGE_DAYS days ago" +%F)
          # Track the newest object date per rollback folder, then emit the
          # folders whose newest object is older than the cutoff.
          aws s3 ls "s3://$S3_BUCKET/rollbacks/" --recursive --region "$AWS_REGION" \
            | awk -v cutoff="$cutoff" '
                {
                  key = $4
                  for (i = 5; i <= NF; i++) key = key " " $i   # full object key
                  split(key, parts, "/")
                  if (parts[1] != "rollbacks" || parts[2] == "") next
                  folder = parts[1] "/" parts[2] "/"
                  if (maxdate[folder] == "" || $1 > maxdate[folder]) maxdate[folder] = $1
                  seen[folder] = 1
                }
                END { for (f in seen) if (maxdate[f] < cutoff) print f }
              ' > /tmp/old-rollbacks.txt

          if [ ! -s /tmp/old-rollbacks.txt ]; then
            echo "No rollbacks older than $MAX_AGE_DAYS days to prune."
            exit 0
          fi

          echo "Pruning rollback backups older than $MAX_AGE_DAYS days (cutoff: $cutoff):"
          while IFS= read -r prefix; do
            echo "  - $prefix"
            aws s3 rm "s3://$S3_BUCKET/$prefix" --recursive --quiet --region "$AWS_REGION"
          done < /tmp/old-rollbacks.txt
          echo "Done."

      - name: Rollback on failure
        if: failure()
        run: |
          set -euo pipefail
          # Stage the backup locally, then sync from LOCAL disk back to the site
          # root. Using a local source avoids the same-bucket sync bug where
          # --exclude "rollbacks/*" filters the source and --delete then wipes
          # the entire bucket root.
          rm -rf rollback-staging && mkdir -p rollback-staging
          aws s3 sync "s3://$S3_BUCKET/rollbacks/${{ github.sha }}/" rollback-staging/ \
            --region "$AWS_REGION"
          if [[ -z "$(find rollback-staging -mindepth 1 -print -quit)" ]]; then
            echo "ERROR: rollback backup is empty; NOT touching live site." >&2
            exit 1
          fi
          aws s3 sync rollback-staging/ "s3://$S3_BUCKET/" \
            --delete --region "$AWS_REGION" \
            --exclude "rollbacks/*" --exclude "pr-*" --exclude "products/*" \
            --cache-control "public, max-age=3600"
          # Restore no-store cache controls for the key pages (the rollback
          # staging sync applies the generic 3600s max-age above).
          for f in index.html admin.html 404.html products.json; do
            if [ -f "rollback-staging/$f" ]; then
              aws s3 cp "rollback-staging/$f" "s3://$S3_BUCKET/$f" \
                --cache-control "no-store" --region "$AWS_REGION"
            fi
          done
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --region "$AWS_REGION"