name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to production (S3 + CloudFront)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Backup current live site
        run: |
          set -euo pipefail
          # Stage the current live site locally first. Syncing S3->S3 across the
          # same bucket (rollbacks/* <-> root) is fragile: the --exclude patterns
          # also match the source and --delete can clobber the whole bucket.
          rm -rf backup-staging && mkdir -p backup-staging
          aws s3 sync "s3://$S3_BUCKET/" backup-staging/ \
            --exclude "rollbacks/*" --exclude "pr-*" --delete --region "$AWS_REGION"
          # Sanity check: never deploy over a broken/empty backup.
          if [ "$(ls -A backup-staging | wc -l | tr -d ' ')" -eq 0 ]; then
            echo "ERROR: backup is empty; aborting to protect the live site." >&2
            exit 1
          fi
          aws s3 sync backup-staging/ "s3://$S3_BUCKET/rollbacks/${{ github.sha }}/" \
            --region "$AWS_REGION"

      - name: Deploy static files to S3
        run: |
          set -euo pipefail
          aws s3 sync dist/images "s3://$S3_BUCKET/images" \
            --delete --region "$AWS_REGION" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --delete --region "$AWS_REGION" \
            --exclude "images/*" --exclude "index.html" --exclude "admin.html" \
            --exclude "404.html" --exclude "products.json" \
            --exclude "rollbacks/*" --exclude "pr-*" \
            --cache-control "public, max-age=3600"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --region "$AWS_REGION" --cache-control "no-store"
          aws s3 cp dist/admin.html "s3://$S3_BUCKET/admin.html" \
            --region "$AWS_REGION" --cache-control "no-store"
          aws s3 cp dist/404.html "s3://$S3_BUCKET/404.html" \
            --region "$AWS_REGION" --cache-control "no-store"
          aws s3 cp dist/products.json "s3://$S3_BUCKET/products.json" \
            --region "$AWS_REGION" --cache-control "no-store"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --region "$AWS_REGION"

      - name: Smoke test live site
        run: |
          curl -fsS --retry 5 --retry-connrefused --retry-delay 2 "$SITE_URL/" > /dev/null
          curl -fsS --retry 5 --retry-connrefused --retry-delay 2 "$SITE_URL/products.json" > /dev/null
          # Branded 404 page should render on unknown URLs (CloudFront error response)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/this-page-does-not-exist")
          if [ "$HTTP_CODE" != "404" ]; then
            echo "ERROR: expected HTTP 404 for unknown path, got $HTTP_CODE" >&2
            exit 1
          fi
          curl -fsS --retry 5 --retry-connrefused --retry-delay 2 -L "$SITE_URL/this-page-does-not-exist" | grep -q "Page Not Found"

      - name: Rollback on failure
        if: failure()
        run: |
          set -euo pipefail
          # Stage the backup locally, then sync from LOCAL disk back to the site
          # root. Using a local source avoids the same-bucket sync bug where
          # --exclude "rollbacks/*" filters the source and --delete then wipes
          # the entire bucket root.
          rm -rf rollback-staging && mkdir -p rollback-staging
          aws s3 sync "s3://$S3_BUCKET/rollbacks/${{ github.sha }}/" rollback-staging/ \
            --region "$AWS_REGION"
          if [ "$(ls -A rollback-staging | wc -l | tr -d ' ')" -eq 0 ]; then
            echo "ERROR: rollback backup is empty; NOT touching live site." >&2
            exit 1
          fi
          aws s3 sync rollback-staging/ "s3://$S3_BUCKET/" \
            --delete --region "$AWS_REGION" \
            --exclude "rollbacks/*" --exclude "pr-*" \
            --cache-control "public, max-age=3600"
          # Restore no-store cache controls for the key pages (the rollback
          # staging sync applies the generic 3600s max-age above).
          for f in index.html admin.html 404.html products.json; do
            if [ -f "rollback-staging/$f" ]; then
              aws s3 cp "rollback-staging/$f" "s3://$S3_BUCKET/$f" \
                --cache-control "no-store" --region "$AWS_REGION"
            fi
          done
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --region "$AWS_REGION"

  preview:
    name: Preview deploy (PR)
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-preview
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy preview to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/pr-${{ github.event.number }}/" \
            --delete --region "$AWS_REGION"

      - name: Invalidate preview CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/pr-${{ github.event.number }}/*" --region "$AWS_REGION"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        with:
          script: |
            const previewUrl = `${process.env.SITE_URL}/pr-${context.issue.number}/`;
            const marker = "<!-- gha:preview -->";
            const body = `${marker}\n### Preview deployed\n\n🚀 **Preview ready:** ${previewUrl}\n\nDeployed from this PR to S3 + CloudFront.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) =>
                c.user && c.user.login === "github-actions[bot]" && c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
