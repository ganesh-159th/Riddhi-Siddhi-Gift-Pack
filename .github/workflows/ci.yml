name: CI

# The quality gate runs on *every* branch push and *every* pull request so no
# code can land anywhere without being linted, tested, audited and built.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality gates (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Guard — pipeline must never modify UI source
        # The build is deterministic and read-only. If it mutates tracked source
        # files the pipeline would be changing the UI by itself, which we never
        # want: fail loudly instead.
        run: |
          if changed=$(git status --porcelain -- src index.html admin.html 404.html public | sed '/^??/d' | tail -n +1) && [ -n "$changed" ]; then
            echo "ERROR: the build modified tracked source files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          echo "OK: build is read-only (no UI source files changed)."

      - name: Verify generated SEO artifacts
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q '<?xml version="1.0" encoding="UTF-8"?>' dist/sitemap.xml
          grep -q 'xmlns:image=' dist/sitemap.xml
          grep -q '<image:image>' dist/sitemap.xml
          grep -q 'Disallow: /admin.html' dist/robots.txt
          grep -q '^Sitemap: ' dist/robots.txt

      - name: Validate workflow YAML (actionlint)
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz
          ./actionlint -color

      - name: Validate CloudFormation templates (cfn-lint + AWS schema)
        # Two checks that catch *different* classes of mistake.
        # `validate-template` only parses the template, so it happily accepts a
        # resource whose properties are semantically wrong; cfn-lint validates
        # each property against the resource schema offline. Both are wanted —
        # cfn-lint alone would miss resource types AWS has since added, and
        # validate-template alone misses bad properties.
        #
        # This gate earned its place: it caught a mis-nested
        # `NotificationsWithSubscribers` (it is a sibling of `Budget`, not a
        # child) that every other check in this pipeline accepted.
        #
        # Only cfn-lint is mandatory. `validate-template` is a *signed API call*,
        # so it needs credentials, and no job in this workflow has any: they run
        # with `permissions: contents: read` and no OIDC step, because the role
        # that would carry `cloudformation:ValidateTemplate` is created by the
        # very template in this branch. Hard-failing on that meant every push
        # and every fork's PR died with NoCredentials before reaching the
        # remaining gates.
        #
        # So the API check is now conditional rather than removed: it runs
        # whenever the job is given credentials (a local run, or a job that
        # later adds OIDC) and is skipped with a visible notice when it is not.
        # Until some job supplies credentials it is dormant on CI — cfn-lint is
        # what actually gates. Both calls are free (CloudFormation and IAM
        # request no charge), so gating this adds no AWS cost.
        run: |
          set -euo pipefail
          shopt -s nullglob
          tpls=(provision/cloudformation/*.yaml)
          if [ ${#tpls[@]} -eq 0 ]; then
            echo "ERROR: expected at least one template in provision/cloudformation/" >&2
            exit 1
          fi
          pipx install --quiet cfn-lint==1.57.1
          have_aws_creds=0
          if aws sts get-caller-identity >/dev/null 2>&1; then
            have_aws_creds=1
          else
            echo "::notice::No AWS credentials in this job; skipping" \
              "aws cloudformation validate-template. cfn-lint still gates."
          fi
          for tpl in "${tpls[@]}"; do
            echo "::group::cfn-lint $tpl"
            cfn-lint --regions=ap-south-1 "$tpl"
            echo "::endgroup::"
            if [ "$have_aws_creds" -eq 1 ]; then
              echo "::group::aws validate-template $tpl"
              aws cloudformation validate-template \
                --template-body "file://$tpl" \
                --region ap-south-1 >/dev/null
              echo "OK: $tpl"
              echo "::endgroup::"
            fi
          done

      - name: Syntax-check provisioning scripts
        # adopt.sh rewrites a live production distribution, so a typo in it is
        # not a lint nit — it is an outage. `bash -n` catches parse errors
        # before the script is ever run against AWS.
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(provision/*.sh provision/cloudformation/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "ERROR: expected provisioning shell scripts" >&2
            exit 1
          fi
          for f in "${scripts[@]}"; do
            bash -n "$f"
            echo "OK: $f"
          done

      - name: Rollback retention is consistent
        # `rollbacks/` retention is stated in three executable places: the S3
        # lifecycle rule (which is what actually runs), the prune step in
        # deploy.yml, and the print-only generate-cost-guardrails.sh. They once
        # read 7, 7 and 90 days. Left alone that is a live cost bug, not just
        # untidy docs: the 90-day variant also transitioned objects to GLACIER
        # at 7d and DEEP_ARCHIVE at 30d, and both carry minimum storage
        # durations (90 and 180 days) with no free-tier allowance, so it would
        # have billed for objects nothing can roll back to. site.yaml is the
        # source of truth; this gate is what stops the other two drifting from
        # it again.
        #
        # Prose (README.md, provision/SETUP.md) is deliberately NOT checked here.
        # A regex over documentation caught "Expire after 30 days" in SETUP.md
        # but missed an equivalent sentence in README, and it came within one
        # rewording of false-positiving on the paragraph that explains the
        # 90/180-day minimums. That is false confidence, not a gate. The docs
        # instead name site.yaml as the source of truth.
        run: |
          set -euo pipefail
          tpl=provision/cloudformation/site.yaml
          wf=.github/workflows/deploy.yml
          script=provision/generate-cost-guardrails.sh
          for f in "$tpl" "$wf" "$script"; do
            [ -f "$f" ] || { echo "ERROR: missing $f" >&2; exit 1; }
          done

          # site.yaml: the DeleteOldRollbacks rule's ExpirationInDays.
          want=$(awk '
            /Id:[[:space:]]*DeleteOldRollbacks/ { inrule = 1; next }
            inrule && /ExpirationInDays:/ {
              gsub(/[^0-9]/, "", $0); print; exit
            }
          ' "$tpl")
          # deploy.yml: MAX_AGE_DAYS on the prune step.
          got=$(awk -F'"' '
            /MAX_AGE_DAYS:/ { print $2; exit }
          ' "$wf")
          # generate-cost-guardrails.sh must emit the same window. This runs the
          # script and inspects what it actually prints rather than grepping its
          # source, so re-hardcoding a literal (including inside the JSON echo)
          # is caught however it is spelled. The script only prints, so running
          # it here costs nothing and needs no credentials.
          emitted=$(
            ACCOUNT_ID=000000000000 BUCKET=ci-placeholder ALERT_EMAIL=ci@example.invalid \
              bash "$script" 2>/dev/null \
            | tr -d '\134' \
            | grep -oE '"Expiration": \{ "Days": [0-9]+ \}' \
            | grep -oE '[0-9]+' \
            | head -1 || true
          )

          if [ -z "$want" ]; then
            echo "ERROR: no DeleteOldRollbacks ExpirationInDays found in $tpl" >&2
            exit 1
          fi
          if [ -z "$got" ]; then
            echo "ERROR: no MAX_AGE_DAYS found in $wf" >&2
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "ERROR: rollback retention disagrees." >&2
            echo "  $tpl (DeleteOldRollbacks): $want days" >&2
            echo "  $wf (MAX_AGE_DAYS):  $got days" >&2
            exit 1
          fi
          if [ -z "$emitted" ]; then
            echo "ERROR: $script printed no rollbacks/ expiration rule." >&2
            exit 1
          fi
          if [ "$want" != "$emitted" ]; then
            echo "ERROR: $script disagrees with $tpl." >&2
            echo "  $tpl: $want days" >&2
            echo "  $script: $emitted days" >&2
            echo "  It must read the value from the template, not hardcode it." >&2
            exit 1
          fi
          echo "OK: rollbacks/ retained $want days in $tpl, $wf and $script"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  admin-responsive:
    # Functional mobile/tablet checks for the admin panel (issue #22). Unlike the
    # visual job, these assert behaviour (no horizontal overflow, tappable
    # targets, camera upload, draft/sync indicator) so they run unconditionally
    # on every push, without any screenshot baselines.
    name: Admin panel responsive (mobile/tablet)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Run admin responsive checks
        run: npx playwright test tests/e2e/admin-responsive.spec.js

  visual:
    # Visual regression gate. Compares the rendered UI against committed
    # baselines (tests/e2e/visual.spec.js-snapshots). Any branch whose UI differs
    # FAILS here — merge is blocked until the change is either fixed or
    # intentionally blessed via the "Update visual baselines" workflow.
    #
    # Make this a REQUIRED status check in Settings -> Branches so a PR can never
    # merge while the visuals differ. Until first-run baselines exist the job
    # warns instead of failing (run the baseline workflow once to seed them).
    name: Visual regression (UI gate)
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Check baselines are committed
        id: baselines
        run: |
          if find tests/e2e -type d -name '*-snapshots' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare rendered UI against baselines
        if: steps.baselines.outputs.found == 'true'
        run: npx playwright test

      - name: Warn if baselines are missing (one-time setup)
        if: steps.baselines.outputs.found != 'true'
        run: |
          echo "::warning title=Visual baselines missing::No committed screenshots found. Run the 'Update visual baselines' workflow (Actions tab) once to seed them, then this job becomes a hard merge gate."

  audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        env:
          # Only pushes to main are gated; PRs and feature branches are report-only.
          BLOCKING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -u
          # The npm registry occasionally returns 503, so retry before failing.
          attempts=3
          rc=99
          for i in $(seq 1 "$attempts"); do
            if npm audit --audit-level=high; then
              rc=0
              break
            else
              rc=$?
              echo "npm audit attempt $i/$attempts exited $rc; retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$BLOCKING" = "true" ]; then
            echo "Blocking npm audit failure (exit $rc). See 'npm audit fix' locally."
            exit "$rc"
          fi
          echo "::notice title=Dependency audit::npm audit exited ${rc} on this branch (non-blocking; gated on main)."
          exit 0

  dependency-review:
    name: Dependency review
    # Dependency review needs GitHub Advanced Security, which is NOT enabled on
    # this private repo. Flip Settings -> Code security, then set the repo
    # variable ENABLE_GHAS=true to turn this gate on automatically.
    if: github.event_name == 'pull_request' && vars.ENABLE_GHAS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0