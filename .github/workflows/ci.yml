name: CI

# The quality gate runs on *every* branch push and *every* pull request so no
# code can land anywhere without being linted, tested, audited and built.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality gates (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Guard — pipeline must never modify UI source
        # The build is deterministic and read-only. If it mutates tracked source
        # files the pipeline would be changing the UI by itself, which we never
        # want: fail loudly instead.
        run: |
          if changed=$(git status --porcelain -- src index.html admin.html 404.html public | sed '/^??/d' | tail -n +1) && [ -n "$changed" ]; then
            echo "ERROR: the build modified tracked source files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          echo "OK: build is read-only (no UI source files changed)."

      - name: Verify generated SEO artifacts
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q '<?xml version="1.0" encoding="UTF-8"?>' dist/sitemap.xml
          grep -q 'xmlns:image=' dist/sitemap.xml
          grep -q '<image:image>' dist/sitemap.xml
          grep -q 'Disallow: /admin.html' dist/robots.txt
          grep -q '^Sitemap: ' dist/robots.txt

      - name: Validate workflow YAML (actionlint)
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz
          ./actionlint -color

      - name: Validate CloudFormation templates (cfn-lint + AWS schema)
        # Two credential-free checks that catch *different* classes of mistake.
        # `validate-template` only parses the template, so it happily accepts a
        # resource whose properties are semantically wrong; cfn-lint validates
        # each property against the resource schema offline. Both are needed —
        # cfn-lint alone would miss resource types AWS has since added, and
        # validate-template alone misses bad properties.
        #
        # This gate earned its place: it caught a mis-nested
        # `NotificationsWithSubscribers` (it is a sibling of `Budget`, not a
        # child) that every other check in this pipeline accepted.
        run: |
          set -euo pipefail
          shopt -s nullglob
          tpls=(provision/cloudformation/*.yaml)
          if [ ${#tpls[@]} -eq 0 ]; then
            echo "ERROR: expected at least one template in provision/cloudformation/" >&2
            exit 1
          fi
          pipx install --quiet cfn-lint==1.57.1
          for tpl in "${tpls[@]}"; do
            echo "::group::cfn-lint $tpl"
            cfn-lint --regions=ap-south-1 "$tpl"
            echo "::endgroup::"
            echo "::group::aws validate-template $tpl"
            aws cloudformation validate-template \
              --template-body "file://$tpl" \
              --region ap-south-1 >/dev/null
            echo "OK: $tpl"
            echo "::endgroup::"
          done

      - name: Syntax-check provisioning scripts
        # adopt.sh rewrites a live production distribution, so a typo in it is
        # not a lint nit — it is an outage. `bash -n` catches parse errors
        # before the script is ever run against AWS.
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(provision/*.sh provision/cloudformation/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "ERROR: expected provisioning shell scripts" >&2
            exit 1
          fi
          for f in "${scripts[@]}"; do
            bash -n "$f"
            echo "OK: $f"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  admin-responsive:
    # Functional mobile/tablet checks for the admin panel (issue #22). Unlike the
    # visual job, these assert behaviour (no horizontal overflow, tappable
    # targets, camera upload, draft/sync indicator) so they run unconditionally
    # on every push, without any screenshot baselines.
    name: Admin panel responsive (mobile/tablet)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Run admin responsive checks
        run: npx playwright test tests/e2e/admin-responsive.spec.js

  visual:
    # Visual regression gate. Compares the rendered UI against committed
    # baselines (tests/e2e/visual.spec.js-snapshots). Any branch whose UI differs
    # FAILS here — merge is blocked until the change is either fixed or
    # intentionally blessed via the "Update visual baselines" workflow.
    #
    # Make this a REQUIRED status check in Settings -> Branches so a PR can never
    # merge while the visuals differ. Until first-run baselines exist the job
    # warns instead of failing (run the baseline workflow once to seed them).
    name: Visual regression (UI gate)
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Check baselines are committed
        id: baselines
        run: |
          if find tests/e2e -type d -name '*-snapshots' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare rendered UI against baselines
        if: steps.baselines.outputs.found == 'true'
        run: npx playwright test

      - name: Warn if baselines are missing (one-time setup)
        if: steps.baselines.outputs.found != 'true'
        run: |
          echo "::warning title=Visual baselines missing::No committed screenshots found. Run the 'Update visual baselines' workflow (Actions tab) once to seed them, then this job becomes a hard merge gate."

  audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        env:
          # Only pushes to main are gated; PRs and feature branches are report-only.
          BLOCKING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -u
          # The npm registry occasionally returns 503, so retry before failing.
          attempts=3
          rc=99
          for i in $(seq 1 "$attempts"); do
            if npm audit --audit-level=high; then
              rc=0
              break
            else
              rc=$?
              echo "npm audit attempt $i/$attempts exited $rc; retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$BLOCKING" = "true" ]; then
            echo "Blocking npm audit failure (exit $rc). See 'npm audit fix' locally."
            exit "$rc"
          fi
          echo "::notice title=Dependency audit::npm audit exited ${rc} on this branch (non-blocking; gated on main)."
          exit 0

  dependency-review:
    name: Dependency review
    # Dependency review needs GitHub Advanced Security, which is NOT enabled on
    # this private repo. Flip Settings -> Code security, then set the repo
    # variable ENABLE_GHAS=true to turn this gate on automatically.
    if: github.event_name == 'pull_request' && vars.ENABLE_GHAS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0