name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Lint, test, audit & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: '22'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Verify generated SEO artifacts
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q '<?xml version="1.0" encoding="UTF-8"?>' dist/sitemap.xml
          grep -q 'xmlns:image=' dist/sitemap.xml
          grep -q '<image:image>' dist/sitemap.xml
          grep -q 'Disallow: /admin.html' dist/robots.txt
          grep -q '^Sitemap: ' dist/robots.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error