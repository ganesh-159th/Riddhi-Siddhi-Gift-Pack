name: Terraform

# Automates `terraform plan` on pull requests and `terraform apply` on main
# (issue #38). The human-only step is the one-time `infra/bootstrap` apply —
# it creates the S3/DynamoDB backend AND the OIDC role this workflow assumes,
# so it cannot bootstrap itself. Everything after that is CI.
#
# Apply is gated by the `production` GitHub Environment, so a merge to main
# pauses on the required reviewers before anything changes. Terraform owns the
# prod stack; CloudFormation must have been removed first (see infra/README.md).

on:
  pull_request:
    paths:
      - "infra/**"
      - "lambda/**"
      - "shared/**"
      - "scripts/build-lambda.mjs"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "lambda/**"
      - "shared/**"
      - "scripts/build-lambda.mjs"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC -> AWS
  pull-requests: write

# Serialize Terraform so two runs never mutate state at once. Never cancel a
# run in progress: an interrupted apply can leave the lock/state half-written.
concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.10.0"
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_API_URL: ${{ vars.AWS_API_URL }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'riddhi-terraform-state-352329341119' }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'terraform-state-lock' }}
  TF_STATE_KEY: riddhi-site/prod/terraform.tfstate
  TF_ROLE_ARN: ${{ secrets.AWS_TF_ROLE_ARN }}
  TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}

jobs:
  plan:
    name: Plan
    # Fork PRs get no secrets/OIDC for this repo, so only same-repo PRs can plan.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Lambda bundle
        # Terraform's archive_file zips this directory, so it must exist before
        # `terraform plan` reads the data source.
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npm run build:lambda

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve admin API origin
        run: |
          set -euo pipefail
          if [ -z "${AWS_API_URL:-}" ]; then
            echo "::error::AWS_API_URL repository variable is not set; the admin CSP needs its origin."
            exit 1
          fi
          origin="$(printf '%s' "$AWS_API_URL" | sed -E 's#^(https://[^/]+).*#\1#')"
          echo "TF_VAR_admin_api_origin=$origin" >> "$GITHUB_ENV"

      - name: Check required configuration
        # Fail fast. Without these the credentials step retries 12 times and the
        # real cause (secret unset / bootstrap not run) is buried in the noise.
        run: |
          set -euo pipefail
          if [ -z "${TF_ROLE_ARN:-}" ]; then
            echo "::error::AWS_TF_ROLE_ARN secret is not set. Run infra/bootstrap once, then add its terraform_role_arn output as the AWS_TF_ROLE_ARN secret — see infra/README.md."
            exit 1
          fi
          if [ -z "${TF_VAR_alert_email:-}" ]; then
            echo "::error::TF_ALERT_EMAIL secret is not set (the budget needs an alert address)."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          role-session-name: terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Plan
        run: |
          set -euo pipefail
          terraform plan -input=false -lock=false -no-color | tee /tmp/plan.txt
          {
            echo "## Terraform plan"
            echo ""
            echo '```'
            tail -c 60000 /tmp/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this Environment gate every apply, so a merge to
    # main does not change production until someone approves.
    environment: production
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Lambda bundle
        # Terraform's archive_file zips this directory, so it must exist before
        # `terraform plan` reads the data source.
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npm run build:lambda

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve admin API origin
        run: |
          set -euo pipefail
          if [ -z "${AWS_API_URL:-}" ]; then
            echo "::error::AWS_API_URL repository variable is not set; the admin CSP needs its origin."
            exit 1
          fi
          origin="$(printf '%s' "$AWS_API_URL" | sed -E 's#^(https://[^/]+).*#\1#')"
          echo "TF_VAR_admin_api_origin=$origin" >> "$GITHUB_ENV"

      - name: Check required configuration
        run: |
          if [ -z "${TF_ROLE_ARN:-}" ]; then
            echo "::error::AWS_TF_ROLE_ARN secret is not set. Run infra/bootstrap once, then add its terraform_role_arn output as the AWS_TF_ROLE_ARN secret — see infra/README.md."
            exit 1
          fi
          if [ -z "${TF_VAR_alert_email:-}" ]; then
            echo "::error::TF_ALERT_EMAIL secret is not set (the budget needs an alert address)."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          role-session-name: terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Plan (saved)
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        # Applying the exact saved plan means what ran was what was planned —
        # nothing can change between the plan and the apply.
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Summary
        if: always()
        run: |
          {
            echo "## Terraform applied"
            echo ""
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **Triggered by**: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"